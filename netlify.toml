# Step Solar marketing website — static site, no build step.
[build]
  publish = "."

# API proxy: /api/* requests reach the CRM backend (hosted on Render).
[[redirects]]
  from = "/api/*"
  to = "https://stepsolar-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Customer tracking portal — /track/:token serves track.html.
[[redirects]]
  from = "/track/*"
  to = "/track.html"
  status = 200

# Canonical domain: www -> apex.
[[redirects]]
  from = "https://www.stepsolar.in/*"
  to = "https://stepsolar.in/:splat"
  status = 301

# Dedicated static SEO landing pages (must come before the city catch-all)
[[redirects]]
  from = "/solar-panel-installation-patna"
  to = "/solar-panel-installation-patna/index.html"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-patna/"
  to = "/solar-panel-installation-patna/index.html"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-bihar"
  to = "/solar-panel-installation-bihar/index.html"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-bihar/"
  to = "/solar-panel-installation-bihar/index.html"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-uttar-pradesh"
  to = "/solar-panel-installation-uttar-pradesh/index.html"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-uttar-pradesh/"
  to = "/solar-panel-installation-uttar-pradesh/index.html"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-ghazipur"
  to = "/solar-panel-installation-ghazipur/index.html"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-ghazipur/"
  to = "/solar-panel-installation-ghazipur/index.html"
  status = 200

# Remaining city URLs fall back to locations.html
[[redirects]]
  from = "/solar-panel-installation-:city/"
  to = "/locations.html?city=:city"
  status = 200

[[redirects]]
  from = "/solar-panel-installation-:city"
  to = "/locations.html?city=:city"
  status = 200

[[redirects]]
  from = "/locations"
  to = "/locations.html"
  status = 200

# Marketing website at the root.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
