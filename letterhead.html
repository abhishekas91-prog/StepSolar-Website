<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #e5e5e5;
  }
  .toolbar {
    max-width: 210mm;
    margin: 10px auto;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .toolbar button {
    background: #1a4fb4;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .toolbar button:hover { background: #143e8f; }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 20px auto;
    background: #fff;
    position: relative;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  .header {
    position: relative;
    height: 32mm;
    overflow: hidden;
  }
  .header-blue {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 100%;
    background: #1a4fb4;
    clip-path: polygon(18% 0, 100% 0, 100% 100%, 0% 100%);
  }
  .logo-box {
    position: absolute;
    top: 3mm; left: 6mm;
    width: 28mm;
    z-index: 2;
  }
  .logo-box img { width: 100%; display: block; }
  .header-text {
    position: absolute;
    top: 5mm;
    left: 44mm;
    right: 8mm;
    color: #fff;
    z-index: 2;
  }
  .header-text h1 {
    font-size: 20px;
    letter-spacing: 0.5px;
    font-weight: 800;
  }
  .header-text p.tagline {
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 2px;
    font-weight: 400;
  }
  .header-ids {
    position: absolute;
    top: 20mm;
    left: 44mm;
    right: 8mm;
    display: flex;
    gap: 24px;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    z-index: 2;
  }
  .header-underline {
    height: 2mm;
    background: #1a4fb4;
  }

  /* ===== CONTENT ===== */
  .content {
    flex: 1;
    padding: 10mm 12mm;
    font-size: 13px;
    color: #222;
    line-height: 1.6;
    outline: none;
  }
  .content:empty:before {
    content: "Yahan apna matter / invoice / letter likhein...";
    color: #999;
  }

  /* ===== FOOTER ===== */
  .footer {
    padding: 0 8mm 6mm 8mm;
  }
  .footer-underline {
    height: 1.5mm;
    background: #1a4fb4;
    margin-bottom: 3mm;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: #333;
    flex-wrap: wrap;
    gap: 6px;
  }
  .footer-row span { display: flex; align-items: center; gap: 5px; }
  .footer-icon {
    width: 14px; height: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #1a4fb4;
    color: #fff;
    border-radius: 50%;
    font-size: 9px;
  }
  .footer-address {
    font-size: 10.5px;
    color: #333;
    margin-top: 3mm;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    .page { box-shadow: none; margin: 0; width: auto; min-height: auto; }
  }
</style>
